<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐릭터 — RASYANCUT</title>
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/core.css?v=2.13.0">
<link rel="stylesheet" href="assets/css/strips.css?v=2.13.0">
<link rel="stylesheet" href="assets/css/characters.css?v=2.13.0">
<link rel="stylesheet" href="assets/css/radio.css?v=2.13.0">
<link rel="stylesheet" href="assets/css/auth.css?v=2.13.0">
<link rel="stylesheet" href="assets/css/military.css?v=2.13.0">
</head>
<body data-nav="character">
<main class="page">

  <!-- 선택 창 -->
  <section class="sec sec--raised clist" data-view="list">
    <div class="hollow clist__hollow" aria-hidden="true">RECORD</div>
    <header class="clist__head">
      <div class="stitle">
        <p class="stitle__en">CHARACTER</p>
        <h1>캐릭터 기록</h1>
        <p class="stitle__no mono">Select a record</p>
      </div>
      <p class="mono clist__count"><span class="gold" data-count>00</span> Records</p>
    </header>
    <nav class="cfac" aria-label="소속별 보기" data-fac></nav>
    <div class="cring" data-ring tabindex="0" aria-roledescription="회전 목록" aria-label="캐릭터 목록. 좌우 화살표, 휠, 끌어서 돌릴 수 있습니다.">
      <ul class="cring__track" data-strips></ul>
      <button class="rbtn cring__btn cring__btn--l" data-ring-prev aria-label="이전 캐릭터"></button>
      <button class="rbtn cring__btn cring__btn--r" data-ring-next aria-label="다음 캐릭터"></button>
    </div>
    <div class="cring__foot">
      <p class="mono"><b class="gold" data-ring-no>01</b> / <span data-ring-total>30</span> · <span data-ring-fac>ALL</span></p>
      <p class="mono cring__hint">Wheel · Drag · ← →</p>
    </div>
  </section>

  <!-- 일러스트 배치 창 -->
  <section class="cview" data-view="detail" hidden>
    <div class="cview__band" aria-hidden="true"></div>
    <div class="cview__band cview__band--thin" aria-hidden="true"></div>
    <div class="cview__dots" aria-hidden="true"></div>

    <div class="cview__top">
      <a class="cview__back mono" href="#">← 목록</a>
      <p class="mono"><span class="gold" data-c-idx>01</span> / <span data-c-total>06</span></p>
    </div>

    <div class="cview__left">
    <div class="cview__info">
      <p class="mono gold" data-c-code>RSC-C01</p>
      <p class="mono cview__kicker">The Record</p>
      <h1 data-c-name>미등록</h1>
      <p class="cview__title" data-c-title></p>
      <dl class="cview__specs" data-c-specs></dl>
    </div>
    <div class="cview__body" data-c-body aria-live="polite"></div>
    </div>

    <figure class="cview__art">
      <div class="cview__frame" data-c-art></div>
      <div class="cview__en" data-c-en aria-hidden="true">UNREGISTERED</div>
      <figcaption class="mono">Illustration <span class="gold" data-c-artno>01</span></figcaption>
    </figure>

    <div class="cview__side">
      <div class="cview__tabs" role="tablist" aria-label="기록 구분">
        <button role="tab" data-tab="profile" aria-selected="true">프로필</button>
        <button role="tab" data-tab="ability" aria-selected="false">능력</button>
        <button role="tab" data-tab="record" aria-selected="false">기록</button>
      </div>
      <div class="cview__nav">
        <button class="rbtn" data-c-prev aria-label="이전 캐릭터"></button>
        <span class="mono">Prev / Next</span>
        <button class="rbtn" data-c-next aria-label="다음 캐릭터"></button>
      </div>
    </div>
  </section>
</main>

<noscript><p style="padding:24px">이 사이트는 자바스크립트가 켜져 있어야 정상적으로 보입니다.</p></noscript>

<script src="assets/js/radio.js?v=2.13.0"></script>
<script src="assets/js/firebase-config.js?v=2.13.0"></script>
<script src="assets/js/auth.js?v=2.13.0"></script>
<script src="assets/js/characters.js?v=2.13.0" data-page></script>
</body>
</html>
